<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Log In</title>
    <link rel="stylesheet" href="login.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<header>
    <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fpnggallery.com%2Fwp-content%2Fuploads%2Ffire-emoji-02.png&f=1&nofb=1&ipt=f402388a14790308fd761c75f5bfa0bace15bb695a27bf464a62b1821633f561&ipo=images" alt="The Floating Point Logo">
</header>
<body>
    <div class="outerBorder">
        <div class="innerBorder">
            <h1>Log in to Ignitous</h1>

            <section>
                <button id="logInGithub"><img id="githubLogo" src="Images/github.D.svg" width="25px" draggable="false">Log in with GitHub</button>
            </section>

            <section>
                <p>Email</p>
                <input type="email">
            </section>

            <section>
                <p>Password</p>
                <input type="password">
            </section>

            <button id="logInButton">Log In</button>
        </div>
    </div>
</body>
</html>
